name: Deploy Supabase functions

# Deploys flyer-extract, link-fetch and fp-job with the Supabase CLI.
# Needs: secret SUPABASE_ACCESS_TOKEN (a personal access token from supabase.com/dashboard/account/tokens) and variable SUPABASE_PROJECT_REF.
# The function secrets GEMINI_API_KEY and JOB_TOKEN are set in Supabase, never here.
on:
  workflow_dispatch:

# Runs JavaScript actions that still declare Node 20 (supabase/setup-cli v1) on Node 24 as well.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          set +e
          status=0
          for fn in flyer-extract link-fetch fp-job; do
            flags=""
            [ "$fn" = "fp-job" ] && flags="--no-verify-jwt"
            out=$(supabase functions deploy "$fn" --project-ref "$REF" $flags 2>&1)
            code=$?
            echo "$out"
            if [ $code -ne 0 ]; then
              status=1
              # Repeat the last lines as an annotation so the reason shows on the run summary page.
              echo "::error title=deploy $fn failed::$(echo "$out" | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
            fi
          done
          exit $status
