name: Readiness report

# Run by hand (Actions -> Readiness report -> Run workflow). Prints, for New York and Los Angeles: upcoming shows, share by source,
# approved venues, top rejection reasons, shows per genre tonight and this week, and whether the notification minimums would be met.
# Counts only; nothing private is printed (logs of public repositories are public).
on:
  workflow_dispatch:
    inputs:
      metros:
        description: 'Cities (comma separated ids)'
        default: 'nyc,la'

# Runs JavaScript actions that still declare Node 20 (supabase/setup-cli v1) on Node 24 as well.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      FP_JOB_URL: ${{ vars.FP_JOB_URL }}
      JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report
        run: |
          TZ=UTC npx tsx scripts/readiness-report.ts --metros "${{ inputs.metros }}" --out report.txt --json report.json
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Also as one annotation, so the report can be read from the run's page and through the API.
          echo "::notice title=Readiness report::$(awk '{printf "%s%%0A", $0}' report.txt)"
      - uses: actions/upload-artifact@v6
        with:
          name: readiness-report
          path: |
            report.txt
            report.json
