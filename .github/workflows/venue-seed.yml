name: Seed venues

# Adds candidate venues from Wikidata (CC0) to the registry. Candidates go live only after the automatic trial read.
# Needs: secret JOB_TOKEN and repository variable FP_JOB_URL.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tick to print the venues instead of adding them'
        type: boolean
        default: false

# Runs JavaScript actions that still declare Node 20 (supabase/setup-cli v1) on Node 24 as well.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FP_JOB_URL: ${{ vars.FP_JOB_URL }}
      JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/seed-venues.ts --wikidata ${{ inputs.dry_run && '--dry-run' || '' }}
