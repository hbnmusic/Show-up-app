name: Refresh listings

# Fetches upcoming shows for New York, Los Angeles and Chicago from JamBase and publishes the feed
# the app downloads (release "listings", file shows.json).
#
# Needs one repository secret: JAMBASE_API_KEY (Settings > Secrets and
# variables > Actions). Without it this workflow does nothing.
#
# Budget: the free JamBase plan allows 1,000 calls a month. A full fetch reads
# every page of the next 60 days for each city (weekly); the other days only ask
# for shows that changed since the last run. The script keeps a running count in
# the feed itself and stops fetching at 900 calls a month.
on:
  schedule:
    - cron: '17 9 * * *'
  # Also run when the fetch code or this workflow changes, so a fix is tried right away.
  push:
    branches: [main]
    paths:
      - scripts/fetch-listings.ts
      - src/lib/listings/**
      - .github/workflows/refresh-listings.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = full on Mondays, incremental otherwise'
        type: choice
        options: [auto, full, incremental]
        default: auto

permissions:
  contents: write

concurrency:
  group: refresh-listings

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      JAMBASE_API_KEY: ${{ secrets.JAMBASE_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$JAMBASE_API_KEY" ]; then
            echo "::notice::JAMBASE_API_KEY is not set; nothing to do."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.have == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.have == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.key.outputs.have == 'true'
        run: npm ci

      - name: Download the current feed
        if: steps.key.outputs.have == 'true'
        run: gh release download listings --pattern shows.json --dir listings --clobber || echo "No feed published yet."

      - name: Fetch listings
        if: steps.key.outputs.have == 'true'
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            # Only the weekly run re-reads everything. A push that changes the fetch code runs incremental
            # (a city missing from the feed is still read in full) so edits do not burn the monthly calls.
            if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "1" ]; then MODE=full; else MODE=incremental; fi
          fi
          npx tsx scripts/fetch-listings.ts --mode "$MODE" --budget 70 --monthly-cap 900 --dump-sample listings/raw-sample.json

      - name: Publish the feed
        if: steps.key.outputs.have == 'true'
        run: |
          gh release view listings >/dev/null 2>&1 || gh release create listings \
            --prerelease --latest=false --title "Listings feed" \
            --notes "Rolling listings feed downloaded by the app. Replaced by the Refresh listings workflow; not an app build."
          gh release upload listings listings/shows.json --clobber

      - name: Keep a few raw records for checking the mapping
        if: steps.key.outputs.have == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: listings-raw-sample
          path: listings/raw-sample.*.json
          retention-days: 3
          if-no-files-found: ignore
