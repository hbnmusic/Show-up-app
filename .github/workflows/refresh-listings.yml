name: Refresh listings

# Fetches upcoming shows for the cities in src/lib/metros.ts from JamBase and publishes one feed
# file per city (release "listings", files shows-<city>.json) plus state.json, the refresh ledger.
#
# Needs one repository secret: JAMBASE_API_KEY (Settings > Secrets and
# variables > Actions). Without it this workflow does nothing.
#
# Budget: the free JamBase plan allows 1,000 calls a month. Each run refreshes only the cities
# that are due (large markets every two days, others weekly), most overdue first, and state.json
# keeps a running monthly count that stops the job at 900 calls.
on:
  schedule:
    - cron: '17 9 * * *'
  # Also run when the fetch code or this workflow changes, so a fix is tried right away.
  push:
    branches: [main]
    paths:
      - scripts/fetch-listings.ts
      - src/lib/listings/**
      - scripts/clean-feeds.ts
      - scripts/apply-switches.ts
      - src/lib/licensed.ts
      - src/lib/flagsCore.ts
      - supabase/functions/_shared/flags.ts
      - .github/workflows/refresh-listings.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = refresh what is due; full = re-read every city (uses many calls); incremental = never do a full read'
        type: choice
        options: [auto, full, incremental]
        default: auto

permissions:
  contents: write

concurrency:
  group: refresh-listings

# Runs JavaScript actions that still declare Node 20 (supabase/setup-cli v1) on Node 24 as well.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      JAMBASE_API_KEY: ${{ secrets.JAMBASE_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$JAMBASE_API_KEY" ]; then
            echo "::notice::JAMBASE_API_KEY is not set; nothing to do."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.have == 'true'

      - uses: actions/setup-node@v5
        if: steps.key.outputs.have == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.key.outputs.have == 'true'
        run: npm ci

      - name: Download the current feeds
        if: steps.key.outputs.have == 'true'
        run: gh release download listings --dir listings --clobber || echo "No feed published yet."

      # Kill switches and licensed-layer switches (public RPCs; the anon key is public by design). Missing values mean everything stays on.
      - name: Read the kill switches
        if: steps.key.outputs.have == 'true'
        id: flags
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_ANON: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p listings
          if [ -n "$SB_URL" ] && [ -n "$SB_ANON" ]; then
            curl -fsS -X POST "$SB_URL/rest/v1/rpc/get_flags" -H "apikey: $SB_ANON" -H "content-type: application/json" -d '{}' -o listings/flags.json || echo "::warning::Could not read the kill switches; keeping defaults."
            curl -fsS -X POST "$SB_URL/rest/v1/rpc/fp_licensed_switches" -H "apikey: $SB_ANON" -H "content-type: application/json" -d '{}' -o listings/licensed-switches.json || echo "::warning::Could not read switches; keeping defaults."
          fi
          npx tsx scripts/apply-switches.ts --dir listings --gate

      # With JamBase switched off this step is skipped, so the run makes zero JamBase calls.
      - name: Fetch listings
        if: steps.key.outputs.have == 'true' && steps.flags.outputs.jambase == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          [ -z "$MODE" ] && MODE=auto
          npx tsx scripts/fetch-listings.ts --mode "$MODE" --dump-sample listings/raw-sample.json

      # Drops photos, prices, links and credit lines left over from the removed ticket-seller enrichment, so old
      # feed files are cleaned once and never come back.
      - name: Clean the feeds
        if: steps.key.outputs.have == 'true'
        run: npx tsx scripts/clean-feeds.ts --dir listings

      # Rebuilds the feeds without JamBase records or credit line when JamBase is switched off.
      - name: Apply the switches to the feeds
        if: steps.key.outputs.have == 'true'
        run: npx tsx scripts/apply-switches.ts --dir listings

      - name: Match first-party shows to the feed (ids only)
        if: steps.key.outputs.have == 'true'
        continue-on-error: true
        env:
          FP_JOB_URL: ${{ vars.FP_JOB_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
        run: |
          if [ -n "$FP_JOB_URL" ] && [ -n "$JOB_TOKEN" ]; then npx tsx scripts/link-licensed.ts --dir listings; fi

      - name: Publish the feed
        if: steps.key.outputs.have == 'true'
        run: |
          gh release view listings >/dev/null 2>&1 || gh release create listings \
            --prerelease --latest=false --title "Listings feed" \
            --notes "Rolling listings feed downloaded by the app. Replaced by the Refresh listings workflow; not an app build."
          # Stale files from earlier versions (the single-file feed and the old enrichment ledger) are removed.
          for a in shows.json tm-state.json; do gh release delete-asset listings "$a" --yes 2>/dev/null || true; done
          gh release upload listings listings/shows-*.json listings/state.json --clobber

      - name: Keep a few raw records for checking the mapping
        if: steps.key.outputs.have == 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: listings-raw-sample
          path: listings/raw-sample.*.json
          retention-days: 3
          if-no-files-found: ignore
